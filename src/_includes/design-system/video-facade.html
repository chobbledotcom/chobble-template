{%- comment -%}
Click-to-play video facade: a thumbnail and play button that load the video
only when pressed, so a page of videos costs nothing until one is played.

The iframe waits inside a <template>; design-system.js swaps it in on click.
Its embed URL autoplays, so the video starts as soon as it appears.

Parameters:
  - video_id: YouTube video ID, or the embed URL of another provider (required)
  - name: Name of the video, used for its accessible labels (required)
  - thumbnail_url: Image path or URL. Defaults to the provider's own
                   thumbnail for a YouTube ID or a Vimeo URL; other
                   providers show a plain panel.
{%- endcomment -%}

{%- assign _thumbnail = video_id | videoThumbnail: thumbnail_url -%}
<button
  type="button"
  class="video-facade{% if _thumbnail == "" %} video-facade--no-thumbnail{% endif %}"
  aria-label="Play {{ name }}"
>
  {%- if _thumbnail != "" -%}
  {%- image _thumbnail, "", "", "", "", "16/9", "", false, true -%}
  {%- endif -%}
  <span class="video-play-button" aria-hidden="true">
    <svg viewBox="0 0 68 48" width="68" height="48">
      <path class="video-play-bg" d="M66.52,7.74c-0.78-2.93-2.49-5.41-5.42-6.19C55.79,.13,34,0,34,0S12.21,.13,6.9,1.55 C3.97,2.33,2.27,4.81,1.48,7.74C0.06,13.05,0,24,0,24s0.06,10.95,1.48,16.26c0.78,2.93,2.49,5.41,5.42,6.19 C12.21,47.87,34,48,34,48s21.79-0.13,27.1-1.55c2.93-0.78,4.64-3.26,5.42-6.19C67.94,34.95,68,24,68,24S67.94,13.05,66.52,7.74z"/>
      <path class="video-play-icon" d="M 45,24 27,14 27,34"/>
    </svg>
  </span>
  <template>{%- include "design-system/video-iframe.html", video_id: video_id, name: name, mode: "click" -%}</template>
</button>
